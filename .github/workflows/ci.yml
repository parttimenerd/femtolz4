name: CI

permissions:
  contents: write

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  native-build:
    name: Native build check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            output: src/main/resources/native/linux-amd64/libfemtolz4.so
          - os: macos-latest
            target: darwin-aarch64
            output: src/main/resources/native/darwin-aarch64/libfemtolz4.dylib
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build native library
        run: python3 build_native.py ${{ matrix.target }}

      - name: Verify output exists
        run: test -f ${{ matrix.output }}

  test-fast:
    name: Fast tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Run fast test suite
        run: mvn --no-transfer-progress -Dnative.skip=true test

  test-full:
    name: Full tests (slow included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Run full test suite
        run: mvn --no-transfer-progress -Dnative.skip=true -Dtest.full=true test

  package:
    name: Package JAR
    needs: [native-build, test-fast, test-full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn --no-transfer-progress package -DskipTests -Dnative.skip=true

      - name: Show JAR size
        run: ls -lh target/femtolz4-*.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: femtolz4-jar
          path: target/femtolz4-*.jar
          retention-days: 30

  release-snapshot:
    name: Refresh snapshot release
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: femtolz4-jar
          path: dist

      - name: Delete previous snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete snapshot --cleanup-tag --yes || true

      - name: Create new snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create snapshot dist/femtolz4-*.jar \
            --title "femtolz4 snapshot" \
            --notes "Automated snapshot for ${GITHUB_SHA}" \
            --prerelease
