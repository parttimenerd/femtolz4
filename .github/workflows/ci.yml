name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:

  # ── 1. Build darwin-aarch64 native lib ──────────────────────────────────────
  native-darwin:
    name: Native lib (darwin-aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build darwin-aarch64 dylib
        run: python3 build_native.py darwin-aarch64

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: native-darwin-aarch64
          path: src/main/resources/native/darwin-aarch64/libfemtolz4.dylib
          retention-days: 7

  # ── 2. Build linux-amd64 native lib ─────────────────────────────────────────
  native-linux:
    name: Native lib (linux-amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build linux-amd64 .so
        run: python3 build_native.py linux-amd64

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-amd64
          path: src/main/resources/native/linux-amd64/libfemtolz4.so
          retention-days: 7

  # ── 3. Test matrix ───────────────────────────────────────────────────────────
  test:
    name: Test — ${{ matrix.os }} / Java ${{ matrix.java }}
    needs: [native-darwin, native-linux]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: 17
          - os: ubuntu-latest
            java: 21
          - os: ubuntu-latest
            java: 25
          - os: macos-latest
            java: 21

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # Slot in freshly-built native libs so tests run against them
      - name: Download darwin-aarch64 dylib
        uses: actions/download-artifact@v4
        with:
          name: native-darwin-aarch64
          path: src/main/resources/native/darwin-aarch64

      - name: Download linux-amd64 .so
        uses: actions/download-artifact@v4
        with:
          name: native-linux-amd64
          path: src/main/resources/native/linux-amd64

      - name: Run tests
        run: mvn --no-transfer-progress test

  # ── 4. Package and upload JAR ────────────────────────────────────────────────
  package:
    name: Package JAR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Download darwin-aarch64 dylib
        uses: actions/download-artifact@v4
        with:
          name: native-darwin-aarch64
          path: src/main/resources/native/darwin-aarch64

      - name: Download linux-amd64 .so
        uses: actions/download-artifact@v4
        with:
          name: native-linux-amd64
          path: src/main/resources/native/linux-amd64

      - name: Build JAR
        run: mvn --no-transfer-progress package -DskipTests

      - name: Show JAR size
        run: ls -lh target/femtolz4-*.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: femtolz4-jar
          path: target/femtolz4-*.jar
          retention-days: 30
